version: '3.8'

services:
  # MongoDB Database Service
  mongodb:
    image: mongo:7.0
    container_name: texplanning-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - texplanning-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # TexPlanning Application & API Service
  texplanning-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: texplanning-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/texplanning
      - JWT_SECRET=texplanning_production_secret_jwt_key_2026
    volumes:
      - uploads_data:/usr/src/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - texplanning-network

networks:
  texplanning-network:
    driver: bridge

volumes:
  mongo_data:
    driver: local
  uploads_data:
    driver: local
